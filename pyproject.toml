[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "virtuoso-workbench-lite"
version = "0.1.0"
description = "Local schematic review and human-approved design requests for agents"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Xinyuan Zhang"}]
dependencies = []

[project.optional-dependencies]
bridge = ["virtuoso-bridge>=0.7,<0.8"]
dev = ["pytest==8.4.2", "ruff==0.14.5", "mypy==1.18.2", "build==1.3.0", "jsonschema==4.25.1"]

[project.scripts]
vwb = "virtuoso_workbench.server:main"

[project.urls]
Repository = "https://github.com/HsinyuanZhang/virtuoso-workbench-lite"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
virtuoso_workbench = ["demo.json", "static/*.html", "static/*.css", "static/*.js", "schemas/*.json", "agent-protocol.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.9"
files = ["src", "workbench.py", "scripts"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "virtuoso_bridge"
ignore_missing_imports = true
